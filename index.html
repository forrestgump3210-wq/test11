<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14232b"><title>오목 · iPad</title><style>
*{box-sizing:border-box}body{margin:0;background:#14232b;color:#f5f4ed;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center;min-height:100dvh}main{width:min(100%,680px);padding:20px 12px 30px}h1{font-size:27px;margin:0 0 5px}p{margin:0;color:#b2c5cc;font-size:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.pill{background:#253e49;padding:9px 12px;border-radius:20px;font-size:13px}#status{font-weight:700;min-height:44px;padding:12px 8px;text-align:center;font-size:17px}canvas{width:100%;aspect-ratio:1;display:block;touch-action:manipulation;border-radius:10px;box-shadow:0 10px 28px #0005;background:#e5bf80}.board{padding:5px;background:#b17c3e;border-radius:14px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button,select{font:inherit;font-weight:650;border:0;border-radius:12px;padding:14px 9px;background:#294653;color:#fff;min-height:49px}button:active{transform:scale(.98)}select{width:100%;background:#d9a55d;color:#17242c}.foot{text-align:center;margin-top:15px;font-size:12px;color:#9db2ba}</style></head><body><main><div class="top"><div><h1>● 오목</h1><p>iPad 터치 게임 · 15 × 15</p></div><span class="pill">흑 ● 선공</span></div><select id="mode" aria-label="게임 모드"><option value="ai">컴퓨터와 대전</option><option value="pvp">2인 대전</option></select><div id="status">흑 차례 · 교차점을 터치하세요</div><div class="board"><canvas id="board" aria-label="오목 바둑판"></canvas></div><div class="controls"><button id="undo">↶ 무르기</button><button id="reset">↻ 새 게임</button><button id="toggle">2인 대전</button></div><p class="foot">가로·세로·대각선으로 5개를 놓으면 승리합니다. 자유룰로 진행합니다.</p></main><script>
(()=>{'use strict';const N=15,C=document.getElementById('board'),ctx=C.getContext('2d'),status=document.getElementById('status'),mode=document.getElementById('mode'),toggle=document.getElementById('toggle');let cells,history,turn,over,busy,last;const dirs=[[1,0],[0,1],[1,1],[1,-1]];const valid=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function resize(){const r=C.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,3);C.width=Math.round(r.width*d);C.height=C.width;render()}function geom(){const s=C.width;return {s,p:s*.061,step:s*.878/14}}function pos(x,y){const g=geom();return [g.p+x*g.step,g.p+y*g.step]}
function render(){if(!ctx||!cells)return;const g=geom();ctx.fillStyle='#e5bf80';ctx.fillRect(0,0,g.s,g.s);ctx.lineWidth=Math.max(1,g.s/500);ctx.strokeStyle='#78552d';for(let i=0;i<N;i++){const a=pos(0,i),b=pos(14,i);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();const c=pos(i,0),e=pos(i,14);ctx.beginPath();ctx.moveTo(...c);ctx.lineTo(...e);ctx.stroke()}for(let x of [3,7,11])for(let y of [3,7,11]){const [px,py]=pos(x,y);ctx.beginPath();ctx.arc(px,py,g.step*.075,0,Math.PI*2);ctx.fillStyle='#75512d';ctx.fill()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(cells[y][x]){const [px,py]=pos(x,y);const rad=g.step*.45;const gr=ctx.createRadialGradient(px-rad*.4,py-rad*.45,rad*.05,px,py,rad);if(cells[y][x]===1){gr.addColorStop(0,'#666');gr.addColorStop(.75,'#171717');gr.addColorStop(1,'#050505')}else{gr.addColorStop(0,'#fff');gr.addColorStop(.75,'#f0eee7');gr.addColorStop(1,'#b8afa0')}ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,rad,0,Math.PI*2);ctx.fill()}if(last){const [px,py]=pos(last.x,last.y);ctx.fillStyle=last.p===1?'#ffcf60':'#b33333';ctx.beginPath();ctx.arc(px,py,g.step*.12,0,Math.PI*2);ctx.fill()}}
function reset(){cells=Array.from({length:N},()=>Array(N).fill(0));history=[];turn=1;over=false;busy=false;last=null;status.textContent='흑 차례 · 교차점을 터치하세요';render()}function line(x,y,dx,dy,p){let n=0;while(valid(x,y)&&cells[y][x]===p){n++;x+=dx;y+=dy}return n}function win(x,y,p){return dirs.some(([dx,dy])=>1+line(x+dx,y+dy,dx,dy,p)+line(x-dx,y-dy,-dx,-dy,p)>=5)}
function move(x,y){if(over||!valid(x,y)||cells[y][x])return false;cells[y][x]=turn;history.push({x,y,p:turn});last={x,y,p:turn};render();if(win(x,y,turn)){over=true;status.textContent=(turn===1?'⚫ 흑':'⚪ 백')+' 승리!';return true}if(history.length===N*N){over=true;status.textContent='무승부';return true}turn=3-turn;status.textContent=(turn===1?'⚫ 흑':'⚪ 백')+' 차례';return true}
function countPattern(x,y,p,dx,dy){let a=0,b=0;let xx=x+dx,yy=y+dy;while(valid(xx,yy)&&cells[yy][xx]===p){a++;xx+=dx;yy+=dy}const open1=valid(xx,yy)&&!cells[yy][xx];xx=x-dx;yy=y-dy;while(valid(xx,yy)&&cells[yy][xx]===p){b++;xx-=dx;yy-=dy}const open2=valid(xx,yy)&&!cells[yy][xx];return {n:a+b+1,open:+open1 + +open2}}
function score(x,y,p){let total=0;for(const [dx,dy] of dirs){const q=countPattern(x,y,p,dx,dy);total+=q.n>=5?1000000:q.n===4?(q.open===2?15000:7000):q.n===3?(q.open===2?1800:180):q.n===2?(q.open===2?90:15):q.n===1?2:0}return total}
function ai(){if(over||turn!==2||mode.value!=='ai')return;let best=-Infinity,choices=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!cells[y][x]){let nearby=history.length===0;for(let a=-2;a<=2&&!nearby;a++)for(let b=-2;b<=2;b++)if(valid(x+a,y+b)&&cells[y+b][x+a])nearby=true;if(!nearby)continue;const s=score(x,y,2)*1.15+score(x,y,1)+Math.random()*4;if(s>best+.01){best=s;choices=[[x,y]]}else if(Math.abs(s-best)<=.01)choices.push([x,y])}const [x,y]=choices[Math.floor(Math.random()*choices.length)]||[7,7];busy=false;move(x,y)}
C.addEventListener('pointerdown',e=>{if(busy||over||mode.value==='ai'&&turn!==1)return;const r=C.getBoundingClientRect(),g=geom(),x=Math.round(((e.clientX-r.left)/r.width*g.s-g.p)/g.step),y=Math.round(((e.clientY-r.top)/r.height*g.s-g.p)/g.step);if(move(x,y)&&!over&&mode.value==='ai'){busy=true;status.textContent='컴퓨터 생각 중…';setTimeout(ai,250)}});
document.getElementById('undo').onclick=()=>{if(!history.length)return;const n=mode.value==='ai'&&history.length>=2?2:1;for(let i=0;i<n;i++){const m=history.pop();if(m)cells[m.y][m.x]=0}last=history.at(-1)||null;turn=history.length?3-history.at(-1).p:1;over=false;busy=false;status.textContent=(turn===1?'⚫ 흑':'⚪ 백')+' 차례';render()};document.getElementById('reset').onclick=reset;mode.onchange=()=>{toggle.textContent=mode.value==='ai'?'2인 대전':'컴퓨터 대전';reset()};toggle.onclick=()=>{mode.value=mode.value==='ai'?'pvp':'ai';mode.onchange()};window.addEventListener('resize',resize);reset();resize()})();
</script></body></html>
